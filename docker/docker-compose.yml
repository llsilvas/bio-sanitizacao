version: '3.8'

services:
    # SQL Server 2019 - Banco de controle do Job de Sanitização
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: sqlserver
    user: "0:0"  # Run as root to avoid volume permission issues
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=sql@2025!Strong
      - MSSQL_PID=Developer
      - MSSQL_AGENT_ENABLED=true
      - MSSQL_COLLATION=Latin1_General_CI_AS
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql/data
      - ./sql-scripts:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "sql@2025!Strong" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - sanitizador-network

  deduplicacao-service:
    build:
      context: ../modules/deduplicacao-service
      dockerfile: Dockerfile
    container_name: bio-deduplicacao-service
    depends_on:
      - postgres
      - redis
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: postgres
      REDIS_HOST: redis
    ports:
      - "8080:8080"
    networks:
      - sanitizador-network

  batch-processor:
    build:
      context: ../modules/batch-processor
      dockerfile: Dockerfile
    container_name: bio-batch-processor
    depends_on:
      - postgres
      - redis
      - deduplicacao-service
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: postgres
      REDIS_HOST: redis
      DEDUPLICACAO_SERVICE_URL: http://deduplicacao-service:8080
    ports:
      - "8081:8081"
    networks:
      - sanitizador-network

volumes:
  sqlserver-data:
  redis-data:

networks:
  sanitizador-network:
    driver: bridge

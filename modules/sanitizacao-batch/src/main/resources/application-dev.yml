spring:
  application:
    name: sanitizacao-batch

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always

  datasource:
    url: jdbc:sqlserver://${DB_HOST}:${DB_PORT:1433};databaseName=${DB_NAME:batch_metadata};encrypt=true;trustServerCertificate=false
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  jpa:
    database-platform: org.hibernate.dialect.SQLServerDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        show_sql: false
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

redis:
  host: ${REDIS_HOST}
  port: ${REDIS_PORT:6379}
  password: ${REDIS_PASSWORD:}
  timeout: 3000
  lettuce:
    pool:
      max-active: 30
      max-idle: 15
      min-idle: 5
      max-wait: 2000

opensearch:
  host: ${OPENSEARCH_HOST}
  port: ${OPENSEARCH_PORT:9200}
  username: ${OPENSEARCH_USER}
  password: ${OPENSEARCH_PASSWORD}
  scheme: ${OPENSEARCH_SCHEME:https}
  ssl:
    verify: ${OPENSEARCH_SSL_VERIFY:true}
  index: ${OPENSEARCH_INDEX:biometric-data}
  scroll:
    timeout: ${OPENSEARCH_SCROLL_TIMEOUT:5m}
    size: ${OPENSEARCH_SCROLL_SIZE:500}
  connection:
    timeout: 10000
    socketTimeout: 120000
  pool:
    maxTotal: 30
    maxPerRoute: 15

deduplicacao:
  service:
    url: ${DEDUPLICACAO_SERVICE_URL}

batch:
  partition:
    grid-size: ${BATCH_PARTITION_GRID_SIZE:10}
  chunk-size: 100

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
      environment: dev

logging:
  level:
    root: INFO
    br.gov.sp.prodesp: DEBUG
    org.springframework.batch: INFO
    org.opensearch: WARN
    org.redisson: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
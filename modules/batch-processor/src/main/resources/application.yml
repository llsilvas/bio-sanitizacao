spring:
  application:
    name: batch-processor

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
      table-prefix: SANITIZADOR_

  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=batch_metadata;encrypt=true;trustServerCertificate=true
    username: sa
    password: Sanitizador@dmin#123
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    database-platform: org.hibernate.dialect.SQLServerDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

redis:
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:6379}

opensearch:
  host: ${OPENSEARCH_HOST:localhost}
  port: ${OPENSEARCH_PORT:9200}
  username: ${OPENSEARCH_USER:admin}
  password: ${OPENSEARCH_PASSWORD:admin}
  scheme: ${OPENSEARCH_SCHEME:https}
  ssl:
    verify: ${OPENSEARCH_SSL_VERIFY:false}
  index: ${OPENSEARCH_INDEX:biometric-data}
  scroll:
    # Timeout do scroll context - quanto tempo o OpenSearch mantém o cursor aberto
    # Recomendação: tempo suficiente para processar um batch completo
    timeout: ${OPENSEARCH_SCROLL_TIMEOUT:5m}
    # Tamanho do scroll = quantos documentos retornar por scroll
    # IMPORTANTE: Deve ser >= chunk-size para minimizar roundtrips
    # Recomendação: 5-10x o chunk-size para buffer
    size: ${OPENSEARCH_SCROLL_SIZE:500}

deduplicacao:
  service:
    url: ${DEDUPLICACAO_SERVICE_URL:http://localhost:8080}

batch:
  partition:
    # Número de partições paralelas (threads)
    grid-size: ${BATCH_PARTITION_GRID_SIZE:10}
  # Número de registros processados por transação/commit
  # Recomendação: 50-200 para balancear performance e rollback
  chunk-size: ${BATCH_CHUNK_SIZE:100}

server:
  port: 8081

logging:
  level:
    root: INFO
    br.gov.sp.prodesp: DEBUG

spring:
  application:
    name: batch-processor

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never

  datasource:
    url: jdbc:sqlserver://${DB_HOST}:${DB_PORT:1433};databaseName=${DB_NAME:batch_metadata};encrypt=true;trustServerCertificate=false
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      maximum-pool-size: 100
      minimum-idle: 50
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
      connection-test-query: SELECT 1
      validation-timeout: 5000

  jpa:
    database-platform: org.hibernate.dialect.SQLServerDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        show_sql: false
        jdbc:
          batch_size: 100
          fetch_size: 100
        order_inserts: true
        order_updates: true
        query:
          in_clause_parameter_padding: true
        cache:
          use_second_level_cache: false
          use_query_cache: false

redis:
  host: ${REDIS_HOST}
  port: ${REDIS_PORT:6379}
  password: ${REDIS_PASSWORD:}
  timeout: 5000
  lettuce:
    pool:
      max-active: 100
      max-idle: 50
      min-idle: 20
      max-wait: 3000
    shutdown-timeout: 10000
  cluster:
    enabled: ${REDIS_CLUSTER_ENABLED:false}
    nodes: ${REDIS_CLUSTER_NODES:}

opensearch:
  host: ${OPENSEARCH_HOST}
  port: ${OPENSEARCH_PORT:9200}
  username: ${OPENSEARCH_USER}
  password: ${OPENSEARCH_PASSWORD}
  scheme: ${OPENSEARCH_SCHEME:https}
  ssl:
    verify: ${OPENSEARCH_SSL_VERIFY:true}
  index: ${OPENSEARCH_INDEX:biometric-data}
  scroll:
    timeout: ${OPENSEARCH_SCROLL_TIMEOUT:10m}
    size: ${OPENSEARCH_SCROLL_SIZE:2000}
  connection:
    timeout: 15000
    socketTimeout: 300000
  pool:
    maxTotal: 100
    maxPerRoute: 50
    validateAfterInactivity: 30000

deduplicacao:
  service:
    url: ${DEDUPLICACAO_SERVICE_URL}
    connection:
      timeout: 15000
      readTimeout: 60000
    pool:
      maxTotal: 200
      maxPerRoute: 100

batch:
  partition:
    grid-size: ${BATCH_PARTITION_GRID_SIZE:50}
  chunk-size: ${BATCH_CHUNK_SIZE:500}
  throttle-limit: ${BATCH_THROTTLE_LIMIT:10}

server:
  port: 8081
  shutdown: graceful
  tomcat:
    threads:
      max: 400
      min-spare: 50
    accept-count: 100
    max-connections: 10000
    connection-timeout: 20000

spring.lifecycle:
  timeout-per-shutdown-phase: 60s

resilience4j:
  circuitbreaker:
    instances:
      deduplicationService:
        failure-rate-threshold: 50
        slow-call-rate-threshold: 50
        slow-call-duration-threshold: 10s
        permitted-number-of-calls-in-half-open-state: 10
        sliding-window-size: 100
        minimum-number-of-calls: 20
        wait-duration-in-open-state: 60s
      opensearch:
        failure-rate-threshold: 50
        slow-call-rate-threshold: 50
        slow-call-duration-threshold: 15s
        permitted-number-of-calls-in-half-open-state: 10
        sliding-window-size: 100
        minimum-number-of-calls: 20
        wait-duration-in-open-state: 30s

  retry:
    instances:
      deduplicationService:
        max-attempts: 3
        wait-duration: 1000
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
      opensearch:
        max-attempts: 5
        wait-duration: 500
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2

  bulkhead:
    instances:
      deduplicationService:
        max-concurrent-calls: 100
        max-wait-duration: 10s
      opensearch:
        max-concurrent-calls: 100
        max-wait-duration: 15s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
      environment: production
      cluster: ${CLUSTER_NAME:eks-prod}
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  level:
    root: WARN
    br.gov.sp.prodesp: INFO
    org.springframework.batch: INFO
    org.opensearch: ERROR
    org.redisson: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: /var/log/batch-processor/application.log
    max-size: 500MB
    max-history: 30
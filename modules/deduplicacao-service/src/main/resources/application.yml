spring:
  application:
    name: deduplicacao-service

  # Cache com Redis
  cache:
    type: redis

# Redis - Cache e Distributed Locks
redis:
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:6379}
  password: ${REDIS_PASSWORD:}

# OpenSearch - Configuração do cliente (opcional para consultas)
opensearch:
  host: ${OPENSEARCH_HOST:localhost}
  port: ${OPENSEARCH_PORT:9200}
  username: ${OPENSEARCH_USER:admin}
  password: ${OPENSEARCH_PASSWORD:admin}
  scheme: ${OPENSEARCH_SCHEME:https}
  ssl:
    verify: ${OPENSEARCH_SSL_VERIFY:false}

server:
  port: 8080

# Configuração do OSIA Client
osia:
  base-url: ${OSIA_BASE_URL:http://localhost:9090/osia/v1}
  connect-timeout: ${OSIA_CONNECT_TIMEOUT:10}
  read-timeout: ${OSIA_READ_TIMEOUT:30}
  write-timeout: ${OSIA_WRITE_TIMEOUT:30}

# Resilience4j - Circuit Breaker e Retry
resilience4j:
  circuitbreaker:
    instances:
      osiaClient:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 30s
        failureRateThreshold: 50
        slowCallRateThreshold: 100
        slowCallDurationThreshold: 10s

  retry:
    instances:
      osiaClient:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - org.springframework.web.reactive.function.client.WebClientRequestException
          - java.net.ConnectException
          - java.util.concurrent.TimeoutException

# SpringDoc OpenAPI / Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  show-actuator: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    root: INFO
    bio.prodesp: DEBUG